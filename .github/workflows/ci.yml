name: CI

on:
  push:
    branches: ["main", "audit/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_PROJECT_ID: ci-placeholder
      VITE_SUPABASE_PROJECT_ID: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.22"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Lint execution-integrity modules
        run: >-
          bunx eslint
          src/lib/execution-audit-consistency.ts
          src/lib/execution-job-claim.ts
          src/lib/execution-job-policy.ts
          src/lib/execution-job-worker.ts
          src/lib/cron-task-guard.ts
          src/lib/execution-run-association.ts
          --rule 'prettier/prettier: off'
      - name: Production build
        run: bun run build

  database-smoke:
    name: Durable execution queue migration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: autostudio_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autostudio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d autostudio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare disposable Supabase-like schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/execution_jobs_bootstrap.sql
      - name: Verify P0 migration chain completeness and order
        run: bash supabase/tests/assert_p0_migration_chain.sh
      - name: Apply server-only connections and AI usage migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010120000_p0_ai_usage_and_connection_storage.sql
      - name: Apply scheduler lease migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010130000_scheduler_leases.sql
      - name: Apply Gmail verification migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010140000_gmail_connection_verification.sql
      - name: Apply Gmail test quota migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010150000_gmail_test_quota.sql
      - name: Apply step outcome certainty migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010160000_step_outcome_certainty.sql
      - name: Apply durable queue migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010170000_durable_execution_jobs.sql
      - name: Apply execution audit reconciliation migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011120000_execution_job_run_reconciliation.sql
      - name: Apply atomic stale-run reconciliation migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011130000_atomic_stale_run_reconciliation.sql
      - name: Apply success/audit consistency guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011140000_execution_success_requires_audit.sql
      - name: Apply automation lease heartbeat migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011150000_automation_lease_heartbeat.sql
      - name: Apply enqueue NULL validation migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011160000_enqueue_null_validation.sql
      - name: Apply one-to-one audit-run association guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011170000_execution_job_run_association_guard.sql
      - name: Apply NULL final-status guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011180000_finish_job_null_status_guard.sql
      - name: Apply enqueue NULL-contract guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011190000_enqueue_null_contract.sql
      - name: Apply scheduler lease NULL-contract guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011200000_scheduler_lease_null_contract.sql
      - name: Apply scheduled release NULL-cursor guard
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011210000_scheduled_release_null_cursor_guard.sql
      - name: Lock authenticated execution-audit writes
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261013100000_lock_execution_audit_writes.sql
      - name: Align queue success with run audit status
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261013110000_execution_success_accepts_success_status.sql
      - name: Verify idempotency, lease fencing and RPC permissions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/execution_jobs_smoke.sql
      - name: Verify concurrent workers claim distinct jobs
        run: bash supabase/tests/execution_jobs_concurrency.sh
